    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2328" transform="translate(63.660234 111.636703)">+ same seed)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2328" transform="translate(243.302344 95.433012)">salted hash</text>
