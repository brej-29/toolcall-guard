   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2328" x="459.36" y="54.178242" transform="rotate(-0 459.36 54.178242)">train 80%</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2328" transform="translate(419.741719 95.433012)">val 5% (threshold</text>
