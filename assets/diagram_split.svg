   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2328" x="459.36" y="147.489891" transform="rotate(-0 459.36 147.489891)">test 15%</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2328" transform="translate(604.845703 79.22932)">Leakage check on all splits</text>
