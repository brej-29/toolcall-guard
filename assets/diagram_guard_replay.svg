   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2328" x="15.84" y="19.302281" transform="rotate(-0 15.84 19.302281)">Where the guard sits, and how replay evaluation works</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #57606a" x="15.84" y="256.65634" transform="rotate(-0 15.84 256.65634)">Replay scores each saved decision point offline. Limitation: after a block, a live agent may retry another way or</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #57606a" x="15.84" y="268.96834" transform="rotate(-0 15.84 268.96834)">succeed at a later step; replay cannot see that, so block rates are per decision point, not per attack.</text>
