   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2328" x="522.72" y="57.058242" transform="rotate(-0 522.72 57.058242)">allow: the tool runs</text>
   </g>
   <g id="text_5">
